[project]
name = "virtual-microscope"
version = "0.1.0"
description = "Virtual microscope simulation backends for pymmcore-plus"
requires-python = ">=3.10"
dependencies = [
    "pymmcore-plus>=0.17.0",
    "numpy>=1.20",
    "scipy>=1.7",
    "opencv-python>=4.5",
    "numba>=0.56",
]

[project.optional-dependencies]
server = ["pymmcore-proxy"]
viz = ["matplotlib", "imageio"]
examples = ["tqdm", "matplotlib"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/virtual_microscope"]

[tool.hatch.build]
include = [
    "src/virtual_microscope/**/*.cfg",
    "src/virtual_microscope/**/*.sim.json",
    "src/virtual_microscope/**/*.py",
]
